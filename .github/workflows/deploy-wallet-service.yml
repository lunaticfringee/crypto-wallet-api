name: Build and Deploy wallet-service

on:
  push:
    branches: [main]
    paths:
      - 'wallet-service/**'
      - '.github/workflows/deploy-wallet-service.yml'

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: ap-northeast-1
  ECR_REPOSITORY: dev-wallet-service
  ECS_CLUSTER: dev-cluster
  ECS_SERVICE: dev-wallet-service

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::798404182966:role/github-actions-crypto-wallet-api
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./wallet-service
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Update Helm values with new image tag
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sed -i "s/tag: \".*\"/tag: \"$IMAGE_TAG\"/" helm/wallet-service/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/wallet-service/values.yaml
          git diff --staged --quiet || git commit -m "Bump wallet-service image tag to ${IMAGE_TAG} [skip ci]"
          git pull --rebase origin main
          git push

      - name: Register new task definition revision
        run: |
          TASK_DEF=$(aws ecs describe-task-definition --task-definition dev-wallet-service --query 'taskDefinition' --output json)
          NEW_TASK_DEF=$(echo "$TASK_DEF" | jq --arg IMAGE "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            '.containerDefinitions[0].image = $IMAGE | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)')
          echo "$NEW_TASK_DEF" > new-task-def.json
          aws ecs register-task-definition --cli-input-json file://new-task-def.json
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}

      - name: Update ECS service with new task definition
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --task-definition dev-wallet-service \
            --force-new-deployment \
            --region $AWS_REGION