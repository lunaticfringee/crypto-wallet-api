replicaCount: 1

image:
  repository: 798404182966.dkr.ecr.ap-northeast-1.amazonaws.com/dev-compliance-service
  pullPolicy: IfNotPresent
  tag: "c571e76e7747a025e7c1d8fbd77d0596466c968a"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
    # eks.amazonaws.com/role-arn: ""   # IRSA role ARN — added in the IRSA phase
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 8001

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5

autoscaling:
  enabled: false   # tracked roadmap item — enabled properly in the HPA phase
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}