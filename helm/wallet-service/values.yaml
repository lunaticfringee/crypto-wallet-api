replicaCount: 1

image:
  repository: 798404182966.dkr.ecr.ap-northeast-1.amazonaws.com/dev-wallet-service
  pullPolicy: IfNotPresent
  tag: "2a7f69fbfe0d4a0864bd11701e931509a9cd425c"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
    # eks.amazonaws.com/role-arn: ""   # IRSA role ARN — added in the IRSA phase
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5

autoscaling:
  enabled: false   # tracked roadmap item — enabled properly in the HPA phase
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}

canary:
  steps:
    - setWeight: 10
    - pause:
        duration: 60s
    - setWeight: 25
    - pause:
        duration: 60s
    - setWeight: 50
    - pause:
        duration: 60s
    - setWeight: 75
    - pause:
        duration: 60s
  analysis:
    successThreshold: 0.95
    interval: 30s
    failureLimit: 5
    count: 5
    initialDelay: 45s