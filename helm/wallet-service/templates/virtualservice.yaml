apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: {{ include "wallet-service.fullname" . }}
spec:
  hosts:
    - {{ include "wallet-service.fullname" . }}
  http:
    - name: primary
      route:
        - destination:
            host: {{ include "wallet-service.fullname" . }}
            subset: stable
          weight: 100
        - destination:
            host: {{ include "wallet-service.fullname" . }}
            subset: canary
          weight: 0