apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wallet-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/lunaticfringee/crypto-wallet-api.git
    targetRevision: HEAD
    path: helm/wallet-service
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy: {}