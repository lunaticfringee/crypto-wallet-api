apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/lunaticfringee/crypto-wallet-api.git
    targetRevision: HEAD
    path: platform/istio
    directory:
      include: "istio-servicemonitor.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=true