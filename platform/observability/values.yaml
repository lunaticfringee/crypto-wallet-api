# Overrides for the kube-prometheus-stack chart
prometheus:
  prometheusSpec:
    retention: 3d          # short retention — dev cluster, not production-scale storage
    resources:
      requests:
        cpu: 200m
        memory: 400Mi
      limits:
        cpu: 500m
        memory: 800Mi
    serviceMonitorSelectorNilUsesHelmValues: false   # scrape ALL ServiceMonitors in the cluster, not just ones this chart labels itself

grafana:
  adminPassword: "changeme"   # placeholder — replace via a real Secret before any shared/production use
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

alertmanager:
  enabled: false   # deliberately disabled for this dev cluster — we already have Grafana's own alerting; avoid running a redundant component