global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'wallet-service'
    static_configs:
      - targets: ['wallet-service:8000']

  - job_name: 'compliance-service'
    static_configs:
      - targets: ['compliance-service:8001']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']