apiVersion: 1
groups:
    - orgId: 1
      name: crypto-wallet-group
      folder: crypto-wallet-alerts
      interval: 1m
      rules:
        - uid: dftz278u5woaoe
          title: Crypto-wallet-error-alert
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: fftz1evqrnlkwc
              model:
                editorMode: code
                expr: sum(rate(http_requests_total{status=~"4xx|5xx"}[1m])) / sum(rate(http_requests_total[1m])) * 100
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 10
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          for: 1m
          isPaused: false
          notification_settings:
            receiver: grafana-default-email
